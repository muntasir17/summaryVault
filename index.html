<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Vault</title>
    <link rel="icon" href="summaryValut.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- <link href="./output.css" rel="stylesheet"> -->
     <script src="https://cdn.tailwindcss.com"></script>
     <script>
    tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }

        }
     </script>
</head>
<!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
<body class="m-0 y-0 flex flex-col justify-center items-center gap-[10px]">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            font-family: "Poppins", sans-serif;
        }
.glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect:hover {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.3);
        }
    </style>
<br>

<header class="fixed top-0 left-0 right-0 z-50 p-4 lg:p-6 transition-all duration-300">
<div class="max-w-7xl mx-auto">
<nav class="glass-card rounded-2xl px-5 py-3 flex items-center justify-between shadow-2xl shadow-black/50 transition-all duration-300 border border-white/10 hover:border-white/20">
                
<!-- Brand / Logo Section -->
<a href="#" class="flex items-center gap-3 group">
<div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-amber-400 to-yellow-200 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform duration-300">SV</div>
<div class="flex flex-col">
  <span class="text-lg font-extrabold tracking-tight text-white group-hover:text-amber-400 transition-colors">Summary<span class="text-amber-400">Vault</span>
</span>
<span class="text-[10px] uppercase font-semibold text-slate-400 tracking-widest -mt-1">Bengali Summaries</span>
</div>
</a>
<!-- Desktop Navigation Links (4 Primary Items) -->
<ul class="hidden lg:flex items-center gap-1 bg-white/[0.03] border border-white/5 p-1.5 rounded-xl backdrop-blur-md">
<li>
<a href="#home" class="relative px-4 py-2 text-sm font-semibold text-white bg-white/10 rounded-lg shadow-inner transition-all duration-200 block">
Home </a>
</li>
<li>
<a href="#books" class="relative px-4 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-all duration-200 block group">Books
<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-amber-400 rounded-full group-hover:w-1/2 transition-all duration-300"></span>
</a>
</li>
<li>
<a href="#vault" class="relative px-4 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-all duration-200 block group flex items-center gap-1.5">
Vault
<span class="px-1.5 py-0.5 text-[10px] font-bold bg-amber-400/10 text-amber-400 border border-amber-400/20 rounded-md">PRO</span>
</a>
</li>
<li>
<a href="#about" class="relative px-4 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-all duration-200 block group">About
<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-0 h-0.5 bg-amber-400 rounded-full group-hover:w-1/2 transition-all duration-300"></span>
</a>
</li>
</ul>
<!-- Right Side Interactive Actions -->
<div class="hidden md:flex items-center gap-3"> 
<div class="relative flex items-center">
<svg class="w-4 h-4 absolute left-3 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
</svg>
<input type="text" id="search-input" placeholder="Search books..." 
class="w-44 focus:w-60 transition-all duration-300 pl-9 pr-4 py-2 bg-white/5 text-xs text-slate-100 placeholder-slate-400 rounded-xl border border-white/10 focus:outline-none focus:border-amber-400/60 focus:bg-slate-900/90 focus:ring-1 focus:ring-amber-400/50"/></div>
<button class="glow-effect relative px-5 py-2 text-xs font-bold text-slate-950 bg-gradient-to-r from-amber-400 via-amber-300 to-yellow-400 rounded-xl transition-all duration-300 hover:scale-105 active:scale-95 shadow-md shadow-amber-500/10 whitespace-nowrap">
 Search
</button>
</div>

  <!-- Mobile Menu Button -->
<button id="mobile-toggle" class="md:hidden p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 focus:outline-none transition-colors" aria-label="Toggle Navigation">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
</svg>
</button>
</nav>
<div id="mobile-menu" class="hidden md:hidden mt-3 glass-card rounded-2xl p-5 border border-white/10 shadow-2xl transition-all">

<div class="flex flex-col space-y-2">

<a href="#books" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 block">Books</a>
<a href="#vault" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 flex items-center justify-between"> Vault
<span class="px-2 py-0.5 text-[10px] font-bold bg-amber-400/10 text-amber-400 border border-amber-400/20 rounded-md">PRO</span>
</a>
<a href="#about" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 block">About</a>
</div>            
</div>
</div>
</header>
