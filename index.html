<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Vault</title>
    <link rel="icon" href="summaryValut.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- <link href="./output.css" rel="stylesheet"> -->
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
<body class="m-0 y-0 flex flex-col justify-center items-center gap-[10px]">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            font-family: "Poppins", sans-serif;
        }

    </style>
<br>

<header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 shadow-lg shadow-slate-950/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="#" class="text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-gold-500 bg-clip-text text-transparent">
                        Summary<span class="text-gold-500">Vault</span>
                    </a>
                </div>

                <!-- Central Desktop Navigation (4 Items + Unique Pill Container) -->
                <nav class="hidden md:flex items-center space-x-1 bg-slate-800/40 p-1.5 rounded-full border border-slate-700/40 shadow-inner">
                    <a href="#home" class="px-5 py-2 rounded-full text-sm font-medium text-white bg-slate-700/60 shadow-sm transition-all duration-200">Home</a>
                    <a href="#books" class="px-5 py-2 rounded-full text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all duration-200">Books</a>
                    <a href="#vault" class="px-5 py-2 rounded-full text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all duration-200">Vault</a>
                    <a href="#about" class="px-5 py-2 rounded-full text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all duration-200">About</a>
                </nav>

                <!-- Right Action CTA Button -->
                <div class="hidden md:flex items-center">
                    <a href="#explore" class="relative group overflow-hidden rounded-full p-[1px] focus:outline-none">
                        <span class="absolute inset-0 bg-gradient-to-r from-gold-500 to-amber-200 transition-all duration-300 opacity-80 group-hover:opacity-100"></span>
                        <span class="relative px-6 py-2.5 rounded-full bg-slate-950 text-sm font-medium text-slate-100 transition-all duration-300 group-hover:bg-opacity-0 group-hover:text-slate-950">
                            Explore Vault
                        </span>
                    </a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="flex md:hidden">
                    <button id="menu-toggle" type="button" class="p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none transition-colors" aria-label="Toggle Menu">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 px-4 pt-4 pb-6 space-y-2">
            <a href="#home" class="block px-4 py-2.5 rounded-xl text-base font-medium text-white bg-slate-800/80">Home</a>
            <a href="#books" class="block px-4 py-2.5 rounded-xl text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800/50 transition-colors">Books</a>
            <a href="#vault" class="block px-4 py-2.5 rounded-xl text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800/50 transition-colors">Vault</a>
            <a href="#about" class="block px-4 py-2.5 rounded-xl text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800/50 transition-colors">About</a>
            <div class="pt-4">
                <a href="#explore" class="w-full block text-center px-4 py-3 rounded-xl bg-gold-500 text-slate-950 font-semibold hover:bg-gold-600 transition-colors shadow-lg shadow-gold-500/10">
                    Explore Vault
                </a>
            </div>
        </div>
    </header>
